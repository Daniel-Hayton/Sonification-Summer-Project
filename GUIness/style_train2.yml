name: 'train'

description: ''

sources: 'objects'

generator:
  type: 'synthesizer'
  preset: 'default'
  mods:
    filter: 'on'
    oscillators:
      osc1:
        form: 'noise'

    volume_lfo:
      use: on
      wave: 'sine'
      amount: 1
      freq: 1

map:
  - output: 'time_evo'
  - output: 'volume_lfo/freq_shift'
    input_range: [0, 200000]
  - output: 'pan'
    input_range: [0, 1]

notes: ['F2']