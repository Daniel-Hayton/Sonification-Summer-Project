name: 'clack'

description: ''

sources: 'events'

generator:
  type: 'synthesizer'
  preset: 'default'
  mods:
    volume_envelope:
      use: on
      A: 0.001
      D: 0.05
      S: 0.0
      R: 0.05

map:
  - output: 'time'
  - output: 'pitch'
  - output: 'pan'
    input_range: [0, 1]
  - output: 'volume'
    input_range: [0, 1]

notes: ['B2']