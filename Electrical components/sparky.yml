name: 'sparky'

description: 'Electrical crackle'

sources: 'objects'

generator:
  type: 'synthesizer'
  preset: 'default'
  mods:

    filter: 'on'
    filter_type: 'HPF1'
    cutoff: 0.2

    oscillators:

      osc1:
        form: 'square'
        level: 0.4

      osc2:
        form: 'noise'
        level: 0.8
     
      osc3:
        form: "square"
        level: 0.25
        detune: 0.5

    pitch_lfo:
      use: 'on'
      wave: 'noise'
      amount: 0.15
      freq: 15
      level: 1

    volume_lfo:
      use: 'on'
      wave: 'noise'
      amount: 1.0
      freq: 30
      level: 1

map:
  - output: 'time_evo'
    input_range: [0.0, 22.0]
  - output: 'pitch_shift'
  - output: 'volume'

notes: ['C5']