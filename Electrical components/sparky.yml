name: 'sparky'
    
description: ''

sources: 'objects'

generator:
  type: 'synthesizer'
  preset: 'default'
  mods:
  
    pitch_lfo:
      use: on
      wave: 'saw'
      amount: 0.5
      freq: 50
      phase: 'random'
      
    volume_lfo:
      use: on
      wave: 'square'
      amount: 1
      freq: 4
    
map:
  - output: 'time_evo'
    input_range: [0, 15]
  - output: 'pitch_shift'
  - output: 'volume_lfo/freq_shift'
  - output: 'volume'
    input_range: [0, 10.0]

notes: ['C5', 'D7']
