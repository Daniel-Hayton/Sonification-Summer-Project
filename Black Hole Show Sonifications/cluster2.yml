name: 'cluster2'

description: ''

sources: 'objects'

generator:
  type: 'synthesizer'
  preset: 'default'
  mods:
    filter: 'on'
    oscillators:
      osc1:
        form: 'sine'
        level: 1
      osc2:
        form: 'sine'
        level: 0.2
        detune: 0.75

map:
  - output: 'time_evo'
  - output: 'volume'
    output_range: [0.3, 1]

notes: ['F2', 'C3', 'F3', 'C4']